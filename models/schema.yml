version: 2

models:
  - name: silver_transactions
    description: "Incrementally deduplicated and cleaned streaming financial transaction records."
    columns:
      - name: transaction_id
        description: "Primary key UUID generated by the streaming application."
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "The unique identifier linking back to the corporate customer registry."
        tests:
          - not_null

  - name: gold_financial_insights
    description: "Analytical aggregation mapping normalized lifetime value (LTV) metrics in USD."
    columns:
      - name: customer_id
        description: "Unique target customer identifier hash."
        tests:
          - unique
          - not_null
